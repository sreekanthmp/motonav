; MotoNav prototype firmware — ESP32 DevKit V1 + 0.96" SSD1306 I2C OLED
;
;   pio run                 # build
;   pio run -t upload       # flash (hold the BOOT button if upload hangs on "Connecting...")
;   pio device monitor      # serial log, 115200 baud
;
; If your display is a 1.3" SH1106 instead of a 0.96" SSD1306, build with:
;   pio run -e esp32dev_sh1106

; Plain "pio run" / the Upload button use the standard SSD1306 build only.
[platformio]
default_envs = esp32dev

; Versions below are the ones this firmware was last compiled with. Bump them deliberately.
[env]
platform = espressif32 @ 8.0.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino @ 2.5.2
    olikraus/U8g2 @ 2.36.18
build_flags =
    -I ../../protocol
    -DCORE_DEBUG_LEVEL=0

[env:esp32dev]

[env:esp32dev_sh1106]
build_flags =
    ${env.build_flags}
    -DOLED_SH1106
