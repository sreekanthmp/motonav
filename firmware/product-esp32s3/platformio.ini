; MotoNav product firmware: ESP32-S3 + 412 x 412 round panel (layout B).
;
;   pio run                 # build for a generic ESP32-S3 dev board (esp32-s3-devkitc-1)
;   pio run -t upload       # flash
;   pio device monitor      # serial log: frame timings, BLE events
;
; The panel driver is a stub until the panel's controller is known (src/panel_stub.cpp): the firmware still receives
; Bluetooth data and renders every frame, and prints how long that takes, so the numbers can be measured on a bare
; ESP32-S3 board before the panel arrives.
;
; Shared code: the Bluetooth service, the received-state store and the map-feed store are the prototype's files, compiled
; from ../prototype-esp32/src (no copy).

[platformio]
default_envs = esp32s3

[env]
platform = espressif32 @ 8.0.0
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    h2zero/NimBLE-Arduino @ 2.5.2
build_flags =
    -I ../../protocol
    -I ../prototype-esp32/src
    -DCORE_DEBUG_LEVEL=0
build_src_filter =
    +<*>
    +<../../prototype-esp32/src/ble_service.cpp>
    +<../../prototype-esp32/src/nav_state.cpp>
    +<../../prototype-esp32/src/nav_map.cpp>

; Generic ESP32-S3 dev board, 8 MB flash. Replace with the real board definition once the PCB exists.
[env:esp32s3]
board = esp32-s3-devkitc-1
